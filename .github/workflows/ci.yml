name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Type-checks the whole repo, including scripts/**/*.ts, which
      # `next build` (run by the Vercel preview) does not reliably cover.
      # `next build` itself is validated by the Vercel preview deployment,
      # so it is intentionally not duplicated here.
      - run: npx tsc --noEmit
      # `npm run lint` can be added once an ESLint config is committed;
      # `next lint` is skipped for now because no config exists yet.
