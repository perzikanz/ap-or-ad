name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # next build（＝実ビルド）は Vercel プレビューが担うのでここでは重複させない。
      - run: npx tsc --noEmit
      - run: npm run lint
