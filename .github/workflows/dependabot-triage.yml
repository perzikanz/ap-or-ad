name: Dependabot Triage

# 前提となるリポジトリ設定（コードでは表現できないため明記する）:
#   1. Settings → General → "Allow auto-merge" を有効にする
#      無効だと `gh pr merge --auto` がエラーになる。
#   2. main に typecheck を required status check として設定する
#      必須チェックが 1 つも無いと auto-merge は CI を待たず即座にマージしてしまう。

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Dependabot が起点の実行では GITHUB_TOKEN が既定で読み取り専用になるため、
# ここで明示的に書き込み権限へ引き上げる。
permissions:
  contents: write
  pull-requests: write

# checkout しないので gh がカレントディレクトリの git remote から
# リポジトリを推測できない。引数を取らない gh label create のために明示する。
env:
  GH_REPO: ${{ github.repository }}

jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 更新種別を取得
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # major 以外は破壊的変更を含まない前提で、必須チェック通過後に自動マージする。
      # --auto なので CI が赤いままマージされることはない。
      - name: マイナー・パッチは自動マージを予約
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # major は人間の判断が要るので、ラベルを付けて相談用のコメントを残すだけに留める。
      # rebase のたびに再通知しないよう opened / reopened に限定する。
      - name: メジャー更新は判断待ちとして通知
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-major'
          && github.event.action != 'synchronize'
        # Dependabot 由来の値はスクリプトに直接展開せず、環境変数経由で渡す。
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          FROM_VERSION: ${{ steps.meta.outputs.previous-version }}
          TO_VERSION: ${{ steps.meta.outputs.new-version }}
          BODY_TEMPLATE: |
            ## 判断待ち: メジャーバージョン更新

            `__DEPS__` の **__FROM__ → __TO__** はメジャー更新のため、自動マージの対象外としました。

            破壊的変更の有無と移行コストを確認したうえで、マージするか保留するかを判断してください。CI が green でも、CI が検査していない範囲（本番ビルドや実行時の挙動）が壊れている可能性があります。

            - 保留する場合はこの PR をオープンのまま残してください
            - 当面追従しないと決めた場合は `.github/dependabot.yml` の `ignore` に追記すると再提示が止まります
            - 移行作業が必要な場合は別ブランチで対応し、その PR をマージしてからこの PR をクローズしてください

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
        run: |
          gh label create needs-decision \
            --color D93F0B \
            --description "破壊的変更の可能性があり、マージ可否の判断が必要" \
            || true
          gh pr edit "$PR_URL" --add-label needs-decision
          body=${BODY_TEMPLATE//__DEPS__/$DEPS}
          body=${body//__FROM__/$FROM_VERSION}
          body=${body//__TO__/$TO_VERSION}
          gh pr comment "$PR_URL" --body "$body"
