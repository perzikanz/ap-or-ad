version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # major PR は判断待ちでオープンのまま滞留するため、上限が低いと
    # 後続のマイナー・パッチ更新まで塞き止められる。余裕を持たせる。
    open-pull-requests-limit: 10
    # minor/patch はまとめて1 PR にし、CI/レビュー回数を抑える。
    # major は破壊的変更を含みうるので個別 PR で気づけるようにグループから外す。
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # 上流が未対応でこちら側に打つ手がないメジャー更新は再提示させない。
    # 対応が入ったらこの記述を消して手動で追従する。
    ignore:
      # eslint-config-next が同梱する eslint-plugin-react が、ESLint 10 で
      # 削除された context.getFilename() を呼ぶため動作しない。
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint が "does not support TS 7.0" と明示的に拒否する。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
