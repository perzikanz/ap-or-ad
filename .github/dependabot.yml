version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # major PR は判断待ちでオープンのまま滞留するため、上限が低いと
    # 後続のマイナー・パッチ更新まで塞き止められる。余裕を持たせる。
    open-pull-requests-limit: 10
    # minor/patch はまとめて1 PR にし、CI/レビュー回数を抑える。
    # major は破壊的変更を含みうるので個別 PR で気づけるようにグループから外す。
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
